<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="電工二種">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<title>電工二種 学科ダッシュボード</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface2:#f0eee8; --text:#1d1c1a; --muted:#6b6862;
  --border:#e2dfd7; --accent:#2f6fdb; --accent-soft:#e3ecfb; --ok:#1f8a4c; --ok-soft:#dff2e6;
  --ng:#c8412f; --ng-soft:#fbe3df; --warn:#b7791f; --warn-soft:#fbf0d9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --surface:#1e1d1b; --surface2:#262522; --text:#ecebe7; --muted:#a19d95;
    --border:#34322e; --accent:#6d9cf0; --accent-soft:#1f2a40; --ok:#4cc27d; --ok-soft:#18311f;
    --ng:#f0715f; --ng-soft:#3a1d18; --warn:#e0a948; --warn-soft:#352a14;
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1e1d1b; --surface2:#262522; --text:#ecebe7; --muted:#a19d95;
  --border:#34322e; --accent:#6d9cf0; --accent-soft:#1f2a40; --ok:#4cc27d; --ok-soft:#18311f;
  --ng:#f0715f; --ng-soft:#3a1d18; --warn:#e0a948; --warn-soft:#352a14;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6;font-size:15px}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 18px;border-bottom:1px solid var(--border)}
nav button{background:none;border:none;color:var(--muted);font:inherit;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
nav .navlink{color:var(--muted);text-decoration:none;padding:8px 12px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav .navlink:hover{color:var(--text)}
nav button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.kpi .lbl{color:var(--muted);font-size:12px}
.kpi .val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:13px;font-weight:500;color:var(--muted)}
h2{font-size:16px;margin:22px 0 10px}
h3{font-size:15px;margin:0 0 8px}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.ok>i{background:var(--ok)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .hd{font-size:12px;color:var(--muted);text-align:center}
.cell{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 7px;min-height:74px;cursor:pointer;font-size:12px;line-height:1.35;text-align:left;color:var(--text);font-family:inherit}
.cell .dt{font-weight:700;font-size:12px}
.cell .tt{color:var(--muted);display:block;margin-top:2px}
.cell.done{background:var(--ok-soft);border-color:var(--ok)}
.cell.miss{background:var(--warn-soft);border-color:var(--warn)}
.cell.today{outline:2px solid var(--accent);outline-offset:1px}
.cell.exam{background:var(--ng-soft);border-color:var(--ng)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--surface2);color:var(--muted);margin-right:4px}
.tag.ex{background:var(--accent-soft);color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--border);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tscroll{overflow-x:auto}
.btn{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:8px 14px;font:inherit;cursor:pointer}
.btn.sec{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.points li{margin:4px 0}
.points label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.points input{margin-top:5px}
.points li{padding-bottom:6px;border-bottom:1px dashed var(--border)}
.points li:last-child{border-bottom:none}
.src{font-size:12px;color:var(--muted);margin:2px 0 0 24px;line-height:1.5}
.q{border-top:1px solid var(--border);padding:12px 0}
.q:first-child{border-top:none}
.q .qt{font-weight:600;margin-bottom:6px}
.opts{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:7px 10px;font:inherit;color:var(--text);cursor:pointer}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--ng-soft);border-color:var(--ng)}
.opt:disabled{cursor:default}
.exp{margin-top:6px;font-size:13px;color:var(--muted);background:var(--surface2);border-radius:6px;padding:6px 10px}
.tt-list{margin:0;padding:0;list-style:none}
.tt-list li{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--border)}
.tt-list li:last-child{border-bottom:none}
.tt-list b{font-variant-numeric:tabular-nums;min-width:92px;color:var(--accent)}
.ansgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.ans{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:4px 6px}
.ans .n{width:28px;font-weight:700;font-variant-numeric:tabular-nums}
.ans button{width:32px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;cursor:pointer}
.ans button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.ans.right{background:var(--ok-soft);border-color:var(--ok)}
.ans.wrong{background:var(--ng-soft);border-color:var(--ng)}
.ans .k{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.note{font-size:13px;color:var(--muted)}
.hide{display:none}
.split{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:820px){.split{grid-template-columns:1.1fr .9fr}}
.daynav{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin-bottom:10px;align-items:center}
.daynav select{width:100%;min-width:0;text-overflow:ellipsis}
body{-webkit-text-size-adjust:100%;overflow-x:hidden}
.wrap{padding-left:max(16px, env(safe-area-inset-left));padding-right:max(16px, env(safe-area-inset-right))}

.h2row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.h2row h2{margin:0}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex:none}
.seg button{background:var(--surface);color:var(--text);border:none;font:inherit;font-size:13px;padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.linkbtn{background:none;border:none;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:4px 0}
.fc-wrap{max-width:560px;margin:0 auto}
.fc-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px}
.fc-scene{perspective:1200px;touch-action:pan-y;-webkit-user-select:none;user-select:none;transition:transform .15s}
.fc-card{display:grid;transition:transform .45s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;cursor:pointer;min-height:300px}
.fc-card.flipped{transform:rotateY(180deg)}
.fc-face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px 16px;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.fc-back{transform:rotateY(180deg)}
.fc-meta{margin-bottom:10px}
.fc-q{font-size:19px;font-weight:700;line-height:1.6;margin:auto 0 10px}
.fc-qs{font-size:13px;color:var(--muted);margin-bottom:4px}
.fc-fig{margin:8px 0 4px}
.fc-fig .fig{max-height:200px}
.fc-a{font-size:19px;font-weight:700;color:var(--accent);line-height:1.6;margin:4px 0}
.fc-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
.fc-src{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5}
.drag-ok .fc-face{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.drag-ng .fc-face{border-color:var(--ng);box-shadow:0 0 0 2px var(--ng)}
.fc-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fc-btn{padding:14px;font:inherit;font-size:16px;font-weight:600;border-radius:10px;border:1px solid;cursor:pointer}
.fc-ng{background:var(--ng-soft);color:var(--ng);border-color:var(--ng)}
.fc-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.fc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.fc-end{text-align:center}
.fc-end .fc-btns{grid-template-columns:1fr}
.fc-sum{display:flex;justify-content:center;gap:40px;margin:14px 0}
.fc-num{display:block;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.deck{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.deck:first-child{border-top:none;padding-top:0}
.deck .btn{white-space:nowrap;flex:none}
.selfull{display:block;width:100%;margin-top:6px;text-align:left}
@media (max-width:560px){
  .fc-card{min-height:340px}
  .fc-q{font-size:18px}
  body{font-size:15px}
  h1{font-size:17px}
  .sub{font-size:12px}
  nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 12px}
  nav::-webkit-scrollbar{display:none}
  nav button{white-space:nowrap;padding:10px 10px}
  nav .navlink{padding:10px 10px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi .val{font-size:22px}
  .card{padding:12px}
  .cal{gap:4px}
  .cell{min-height:44px;padding:4px;font-size:11px;text-align:center}
  .cell .tt{display:none}
  .daynav{grid-template-columns:1fr 1fr}
  .daynav select{grid-column:1 / -1;grid-row:1}
  .opts{grid-template-columns:1fr}
  .opt{padding:10px 12px;min-height:44px}
  .ans button{width:38px;height:36px}
  .ansgrid{grid-template-columns:1fr}
  .tt-list li{flex-direction:column;gap:0}
  .tt-list b{min-width:0}
  .points input{width:20px;height:20px;margin-top:2px;flex:none}
  .src{margin-left:28px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>第二種電気工事士 学科試験ダッシュボード</h1>
    <div class="sub">試験日 2026年10月25日（日）筆記方式 ／ 教材：『学科試験すい〜っと合格 2026年版』</div>
  </div>
  <div class="row">
    <button class="btn sec" id="themeBtn" type="button">表示切替</button>
  </div>
</header>
<nav id="nav">
  <button data-v="home" class="on">ホーム</button>
  <button data-v="drill">暗記カード</button>
  <button data-v="day">日別カリキュラム</button>
  <button data-v="exam">過去問</button>
  <a class="navlink" href="http://dxp2800:8080/drill/" title="NASの過去問200選（Tailscale接続時のみ）">過去問200選 ↗</a>
  <button data-v="weak">弱点復習</button>
  <button data-v="tt">時間割</button>
  <button data-v="data">データ</button>
</nav>

<section id="v-home"></section>
<section id="v-drill" class="hide"></section>
<section id="v-day" class="hide"></section>
<section id="v-exam" class="hide"></section>
<section id="v-weak" class="hide"></section>
<section id="v-tt" class="hide"></section>
<section id="v-data" class="hide"></section>
</div>

<script src="figs.js"></script>
<script src="tools.js"></script>
<script src="cards.js"></script>
<script>
// ====== 教材データ ======
// 本のページ → PDFページ：見開き1ページなので PDF ≒ 本のページ÷2＋4
const L = ['イ','ロ','ハ','ニ'];
const EXAM_DATE = '2026-10-25';

const DAYS = [
{id:1,date:'2026-09-27',cat:'基礎知識',title:'はじめの一歩：電線・電圧・接地の基本',book:'p.6–22',pdf:7,
points:[
'単線は直径[mm]、より線は断面積[mm²]で表す。1.6mm≒2mm²、2.0mm≒3.5mm²、2.6mm≒5.5mm²',
'低圧＝交流600V以下・直流750V以下／高圧＝7000V以下／特別高圧＝7000V超',
'変圧器の低圧側の1線はB種接地されている → これが接地側電線（白）。対地電圧は0V',
'コンセントの長い穴（9mm）が接地側（W）、短い穴（7mm）が非接地側',
'スイッチ（点滅器）は非接地側に入れる',
'短絡・過負荷 → 過電流遮断器（ヒューズ・配線用遮断器）／地絡（漏電）→ 漏電遮断器（零相変流器ZCTで検出）',
'交流の値は実効値で表す。実効値100Vの最大値は約141V（×√2）',
'電圧の維持範囲：標準100V → 101±6V、標準200V → 202±20V'],
quiz:[
{q:'低圧の範囲（交流）はどれか。',c:['300V以下','600V以下','750V以下','7000V以下'],a:1,e:'低圧は交流600V以下、直流750V以下。'},
{q:'直流の場合、低圧となる電圧の上限はどれか。',c:['600V','650V','750V','1000V'],a:2,e:'直流は750V以下が低圧。'},
{q:'直径2.0mmの単線は、断面積でおよそ何mm²のより線と同等に扱うか。',c:['2mm²','3.5mm²','5.5mm²','8mm²'],a:1,e:'1.6mm≒2mm²、2.0mm≒3.5mm²、2.6mm≒5.5mm²。'},
{q:'100V用コンセントの長いほうの穴（9mm）につながる電線はどれか。',c:['非接地側電線','接地側電線','接地線（アース）','どちらでもよい'],a:1,e:'長い穴＝接地側（W表示）。接地側は「アース」ではない点に注意。'},
{q:'漏電（地絡）を検出するための部品はどれか。',c:['バイメタル','零相変流器（ZCT）','安定器','電磁接触器'],a:1,e:'漏電遮断器や漏電火災警報器は零相変流器で漏れ電流を検出する。バイメタルは過電流の検出。'},
{q:'家庭用の実効値100Vの交流電圧の最大値はおよそいくらか。',c:['100V','121V','141V','173V'],a:2,e:'最大値＝実効値×√2 ≒ 100×1.41 = 141V。'},
{q:'電灯を点滅させるスイッチを入れる電線はどれか。',c:['接地側電線','非接地側電線','中性線','接地線'],a:1,e:'非接地側点滅が原則。スイッチを切れば電灯に電圧がかからず安全。'},
{q:'標準電圧100Vの場合に維持すべき電圧の範囲はどれか。',c:['101±6V','100±10V','101±10V','100±6V'],a:0,e:'100V → 101±6V、200V → 202±20V。'}]},

{id:2,date:'2026-09-28',cat:'配線図記号',title:'1-1〜1-4 配線の線種・管の記号・ボックス・分電盤',book:'p.24–31',pdf:16,
points:[
'実線＝天井隠ぺい配線、長い破線＝床隠ぺい配線、点線＝露出配線、一点鎖線＝地中埋設配線',
'特記のない電灯配線はVVF（VVF1.6）',
'管の記号：記号なし＝薄鋼・厚鋼、E＝ねじなし電線管、F2＝2種金属製可とう電線管、PF/CD＝合成樹脂製可とう電線管、VE＝硬質ポリ塩化ビニル電線管、HIVE＝耐衝撃性硬質ポリ塩化ビニル電線管、FEP＝波付硬質合成樹脂管（地中）',
'円に斜線 ＝ VVF用ジョイントボックス、□ ＝ ジョイントボックス（アウトレットボックス）、□に× ＝ プルボックス',
'立上り・引下げ・素通しの記号で上下階へのつながりを表す',
'Wh＝電力量計。B＝配線用遮断器、E＝漏電遮断器、BE＝過負荷保護付漏電遮断器',
'漏電遮断器：高速形＝動作時間0.1秒以内、高感度形＝定格感度電流30mA以下'],
quiz:[
{q:'配線図で「点線」で表される配線はどれか。',c:['天井隠ぺい配線','床隠ぺい配線','露出配線','地中埋設配線'],a:2,e:'実線＝天井隠ぺい、破線＝床隠ぺい、点線＝露出、一点鎖線＝地中埋設。'},
{q:'配線図で「一点鎖線」で表される配線はどれか。',c:['天井隠ぺい配線','床隠ぺい配線','露出配線','地中埋設配線'],a:3,e:'一点鎖線は地中埋設配線。'},
{q:'「IV1.6（E19）」の（E19）が表す電線管はどれか。',c:['薄鋼電線管','ねじなし電線管','硬質ポリ塩化ビニル電線管','合成樹脂製可とう電線管'],a:1,e:'E＝ねじなし電線管。薄鋼・厚鋼は記号なしで数字だけ。'},
{q:'地中配線に使われる「FEP」はどれか。',c:['波付硬質合成樹脂管','耐衝撃性硬質ポリ塩化ビニル電線管','2種金属製可とう電線管','合成樹脂製可とう電線管'],a:0,e:'FEP＝波付硬質合成樹脂管。地中埋設の保護管。'},
{q:'分電盤内の記号「BE」が表すものはどれか。',c:['配線用遮断器','漏電遮断器（過負荷保護なし）','過負荷保護付漏電遮断器','電磁開閉器'],a:2,e:'B＝配線用遮断器、E＝漏電遮断器、BE＝過負荷保護付漏電遮断器。'},
{q:'高感度形漏電遮断器の定格感度電流はどれか。',c:['15mA以下','30mA以下','100mA以下','500mA以下'],a:1,e:'高感度形＝30mA以下、高速形＝0.1秒以内。'},
{q:'「VE」が表す電線管はどれか。',c:['硬質ポリ塩化ビニル電線管','波付硬質合成樹脂管','合成樹脂製可とう電線管（CD管）','厚鋼電線管'],a:0,e:'VE＝硬質ポリ塩化ビニル電線管。HIVEは耐衝撃性タイプ。'},
{q:'円の中に斜線が入った記号が表すものはどれか。',c:['プルボックス','VVF用ジョイントボックス','ジャンクションボックス','コンクリートボックス'],a:1,e:'円に斜線＝VVF用ジョイントボックス（ケーブル相互の接続）。'}]},

{id:3,date:'2026-09-29',cat:'配線図記号',title:'1-5〜1-6 照明器具・コンセントの記号',book:'p.32–37',pdf:20,

  let best = null;
  Object.keys(EXAMS).forEach(k => { const s = examScore(k); if(s.total === 50){ const pt = s.right*2; if(best === null || pt > best) best = pt; } });
  const cats = ['基礎知識','配線図記号','器具・材料・工具','複線図','配線設計・施工','検査','法令','基礎理論'];
  let h = `<div class="grid kpis">
    <div class="card kpi"><div class="lbl">試験まで</div><div class="val">${left > 0 ? left : 0}<small> 日</small></div><div class="note">10/25（日）筆記方式</div></div>
    <div class="card kpi"><div class="lbl">完了した日</div><div class="val">${done}<small> / ${DAYS.length}日</small></div><div class="bar ok"><i style="width:${done/DAYS.length*100}%"></i></div></div>
    <div class="card kpi"><div class="lbl">練習問題の正答率</div><div class="val">${qs.ans ? Math.round(qs.ok/qs.ans*100) : '–'}<small>${qs.ans ? ' %' : ''}</small></div><div class="note">解いた問題 ${qs.ans} / ${qs.tot}問</div></div>
    <div class="card kpi"><div class="lbl">過去問ベスト</div><div class="val">${best === null ? '–' : best}<small>${best === null ? '' : ' 点'}</small></div><div class="note">合格ライン60点（30問正解）</div></div>
  </div>`;
  h += `<div class="split" style="margin-top:12px">`;
  if(td){
    const st = ds(td.id), tt = td.type === 'exam' ? (td.part === 1 ? TIMETABLE.exam1 : TIMETABLE.exam2) : td.type === 'review' ? TIMETABLE.review : TIMETABLE.study;
    h += `<div class="card"><h3>今日のメニュー（${md(td.date)} ${wd(td.date)}）</h3>
      <div><span class="tag ex">${esc(td.cat)}</span>${st.done ? '<span class="tag" style="color:var(--ok)">完了</span>' : ''}</div>
      <p style="margin:6px 0 10px;font-weight:600">${esc(td.title)}</p>
      ${td.book ? `<p class="note" style="margin:0 0 8px">本 ${td.book}（PDF ${td.pdf}ページ〜）</p>` : ''}
      <ul class="tt-list">${tt.map(r => `<li><b>${r[0]}</b><span>${esc(r[1])}</span></li>`).join('')}</ul>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="openDay(${td.id})">今日の学習を開く</button><button class="btn sec" onclick="go('drill')">暗記カード</button></div></div>`;
  } else {
    h += `<div class="card"><h3>学習期間は終了しました</h3><p>試験当日の持ち物：受験票、HBの鉛筆（シャープペンシル可）、プラスチック消しゴム、時計。電卓とスマートフォンは使えません。</p></div>`;
  }
  h += `<div class="card"><h3>分野ごとの練習問題の正答率</h3><table><tbody>`;
  cats.forEach(c => { const s = quizStats(d => d.cat === c); const r = s.ans ? Math.round(s.ok/s.ans*100) : null;
    h += `<tr><td style="width:40%">${c}</td><td><div class="bar ${r !== null && r >= 70 ? 'ok' : ''}"><i style="width:${r || 0}%"></i></div></td><td class="num" style="width:70px">${r === null ? '未着手' : r+'%'}</td></tr>`; });
  h += `</tbody></table><p class="note" style="margin:8px 0 0">70%以上で緑。低い分野は弱点復習タブで解き直す。</p></div></div>`;

  h += `<h2>4週間のカレンダー</h2><div class="cal">${'日月火水木金土'.split('').map(x => `<div class="hd">${x}</div>`).join('')}`;
  const t = todayStr();
  DAYS.forEach(d => { const st = ds(d.id); let cls = 'cell';
    if(st.done) cls += ' done'; else if(d.date < t) cls += ' miss';
    if(d.date === t) cls += ' today';
    h += `<button class="${cls}" onclick="openDay(${d.id})"><span class="dt">${md(d.date)}</span><span class="tt">${esc(shortTitle(d))}</span></button>`; });
  h += `<div class="cell exam" style="cursor:default"><span class="dt">10/25</span><span class="tt">本番</span></div></div>`;
  h += `<p class="note">緑＝完了、黄＝予定日を過ぎて未完了、青枠＝今日。日付を押すとその日の内容を開く。</p>`;

  h += `<h2>過去問の成績</h2><div class="card tscroll"><table><thead><tr><th>回</th><th class="num">問1〜30</th><th class="num">問31〜50</th><th class="num">合計</th><th>判定</th></tr></thead><tbody>`;
  Object.keys(EXAMS).forEach(k => { const e = es(k), key = EXAMS[k].key;
    const part = p => { if(!e.graded[p]) return '–'; const [a,b] = examRange(p); let r = 0; for(let n=a;n<=b;n++) if(e.ans[n] === key[n-1]) r++; return r+' / '+(b-a+1); };
    const s = examScore(k);
    h += `<tr><td>${EXAMS[k].name}</td><td class="num">${part(1)}</td><td class="num">${part(2)}</td><td class="num">${s.total === 50 ? s.right*2+'点' : '–'}</td><td>${s.total === 50 ? (s.right >= 30 ? '<span style="color:var(--ok)">合格ライン到達</span>' : '<span style="color:var(--ng)">あと'+(30-s.right)+'問</span>') : ''}</td></tr>`; });
  h += `</tbody></table></div>`;
  $('#v-home').innerHTML = h;
}
const SHORT = ['','電線・電圧・接地','配線・管・ボックス','照明・コンセント記号','スイッチ・動力記号','電線・接続材料','電線管と工具','器具・測定器','電動機・照明・コード',
  '複線図の基本','3路・4路スイッチ','本数・リングスリーブ','許容電流・遮断器','幹線・分岐回路','引込線・施工場所','がいし・ケーブル・地中','金属管・ダクト','接地・漏電遮断器',
  '検査方法','法令','抵抗・電力の計算','交流・三相・電圧降下','過去問① 問1〜30','過去問① 問31〜50','過去問② 問1〜30','過去問② 問31〜50','過去問③ 問1〜30','過去問③ 問31〜50','総復習'];
function shortTitle(d){ return SHORT[d.id]; }

// ====== 日別 ======
function renderDay(){
  const d = DAYS.find(x => x.id === curDay), st = ds(d.id);
  const idx = DAYS.indexOf(d);
  let h = `<div class="daynav">
    <button class="btn sec" ${idx === 0 ? 'disabled' : ''} onclick="openDay(${idx > 0 ? DAYS[idx-1].id : d.id})">← 前の日</button>
    <select id="daySel" class="btn sec">${DAYS.map(x => `<option value="${x.id}" ${x.id === d.id ? 'selected' : ''}>Day ${x.id}（${md(x.date)} ${wd(x.date)}）${esc(x.title)}</option>`).join('')}</select>
    <button class="btn sec" ${idx === DAYS.length-1 ? 'disabled' : ''} onclick="openDay(${idx < DAYS.length-1 ? DAYS[idx+1].id : d.id})">次の日 →</button></div>`;
  h += `<div class="card"><div><span class="tag ex">Day ${d.id}</span><span class="tag">${md(d.date)}（${wd(d.date)}）</span><span class="tag">${esc(d.cat)}</span></div>
    <h2 style="margin:8px 0">${esc(d.title)}</h2>`;
  if(d.book) h += `<p style="margin:0">本 ${d.book} ／ ${pdfRef(d.pdf, 'book.pdf の '+d.pdf+'ページ'+(LOCAL ? 'を開く' : ''))}</p>`;
  const tt = d.type === 'exam' ? (d.part === 1 ? TIMETABLE.exam1 : TIMETABLE.exam2) : d.type === 'review' ? TIMETABLE.review : TIMETABLE.study;
  h += `<h3 style="margin-top:14px">時間割（60分）</h3><ul class="tt-list">${tt.map(r => `<li><b>${r[0]}</b><span>${esc(r[1])}</span></li>`).join('')}</ul></div>`;

  if(d.points){
    const n = d.points.filter((_,i) => st.learned[i]).length;
    const cardMode = dayCardMode === null ? isPhone() : dayCardMode;
    h += `<div class="h2row"><h2>今日覚えること（${n} / ${d.points.length}）</h2><div class="seg"><button class="${cardMode ? 'on' : ''}" onclick="setDayMode(true)">カード</button><button class="${cardMode ? '' : 'on'}" onclick="setDayMode(false)">一覧</button></div></div>`;
    if(cardMode){
      if(!FCS.day || FCS.day.key !== d.id) FCS.day = newSession(allCards(x => x.id === d.id), 'Day '+d.id, d.id);
      h += `<div id="fc-day">${fcHTML('day')}</div>`;
    } else {
    h += `<div class="card"><ul class="points" style="list-style:none;padding:0;margin:0">`;
    d.points.forEach((p,i) => { const s = (SOURCES[d.id] || [])[i];
      h += `<li><label><input type="checkbox" ${st.learned[i] ? 'checked' : ''} onchange="toggleLearn(${d.id},${i},this.checked)"><span>${esc(p)}</span></label>${s ? `<div class="src">出典：${pdfRef(s[0], 'PDF '+s[0]+'ページ')}（本 ${esc(s[1])}）${esc(s[2])}</div>` : ''}</li>`; });
    h += `</ul></div>`;
    }
  }
  if(d.quiz){
    const s = quizStats(x => x.id === d.id);
    h += `<h2>練習問題（${s.ok} / ${d.quiz.length} 正解）</h2><div class="card">${d.quiz.map((q,i) => qHTML(d,q,i)).join('')}
      <div class="row" style="margin-top:8px"><button class="btn sec" onclick="resetQuiz(${d.id})">この日の練習問題をやり直す</button></div></div>`;
  }
  if(d.type === 'exam') h += examHTML(d.set, d.part);
  if(d.type === 'review') h += reviewHTML();
  h += `<div class="row" style="margin-top:16px"><button class="btn" onclick="toggleDone(${d.id})">${st.done ? '完了を取り消す' : 'この日を完了にする'}</button>${st.done ? '<span style="color:var(--ok)">完了済み</span>' : ''}</div>`;
  $('#v-day').innerHTML = h;
  $('#daySel').onchange = e => openDay(+e.target.value);
  bindCard('day');
}
function qHTML(d,q,i){
  const st = ds(d.id), ch = st.quiz[i], answered = ch !== undefined;
  return `<div class="q"><div class="qt">問${i+1}　${esc(q.q)}</div><div class="opts">${q.c.map((c,j) => {
    let cls = 'opt'; if(answered){ if(j === q.a) cls += ' right'; else if(j === ch) cls += ' wrong'; }
    return `<button class="${cls}" ${answered ? 'disabled' : ''} onclick="answer(${d.id},${i},${j})">${L[j]}．${esc(c)}</button>`; }).join('')}</div>
    ${answered ? `<div class="exp">${ch === q.a ? '正解' : '不正解（正解は'+L[q.a]+'）'}：${esc(q.e)}</div>` : ''}</div>`;
}
function answer(id,i,j){ ds(id).quiz[i] = j; save(); render(); }
function resetQuiz(id){ ds(id).quiz = {}; save(); render(); }
function toggleLearn(id,i,v){ ds(id).learned[i] = v; save(); if(view === 'day') renderDay(); }
function setDayMode(v){ dayCardMode = v; renderDay(); }
function toggleDone(id){ const st = ds(id); st.done = !st.done; save(); render(); }

// ====== 過去問 ======
function examHTML(set, part){
  const ex = EXAMS[set], e = es(set), [a,b] = examRange(part), graded = e.graded[part];
  let right = 0; if(graded) for(let n=a;n<=b;n++) if(e.ans[n] === ex.key[n-1]) right++;
  let h = `<h2>${esc(ex.name)} 問${a}〜${b}</h2><div class="card">
    <p style="margin-top:0"><a href="${ex.q}" target="_blank">問題PDFを開く</a> ／ <a href="${ex.a}" target="_blank">公式の解答PDF</a>　<span class="note">${part === 1 ? '問題1（一般問題）' : '問題2（配線図）の図面は問題冊子の15頁'}</span></p>
    <p class="note">解いたあとに自分の答えを入力して「採点する」を押す。採点後は正解が右端に表示される。</p>
    <div class="ansgrid">`;
  for(let n=a;n<=b;n++){ const sel = e.ans[n], k = ex.key[n-1];
    let cls = 'ans'; if(graded) cls += sel === k ? ' right' : ' wrong';
    h += `<div class="${cls}"><span class="n">${n}</span>${L.map(x => `<button class="${sel === x ? 'sel' : ''}" ${graded ? 'disabled' : ''} onclick="setAns('${set}',${n},'${x}')">${x}</button>`).join('')}${graded ? `<span class="k">${sel === k ? '○' : '正解 '+k}</span>` : ''}</div>`; }
  h += `</div><div class="row" style="margin-top:10px">`;
  if(!graded) h += `<button class="btn" onclick="grade('${set}',${part})">採点する</button><span class="note">未入力の問題は不正解として数える</span>`;
  else h += `<b style="font-size:18px">${right} / ${b-a+1}問正解（${right*2}点 / ${(b-a+1)*2}点）</b><button class="btn sec" onclick="regrade('${set}',${part})">解き直す（入力を消す）</button>`;
  h += `</div>`;
  const s = examScore(set);
  if(s.total === 50) h += `<p style="margin-bottom:0">この回の合計：<b>${s.right*2}点</b>（${s.right}問正解）— ${s.right >= 30 ? '合格ライン（60点）に到達' : '合格ラインまであと'+(30-s.right)+'問'}</p>`;
  h += `</div>`;
  return h;
}
function setAns(set,n,x){ es(set).ans[n] = x; save(); render(); }
function grade(set,part){ es(set).graded[part] = true; save(); render(); }
function regrade(set,part){ const e = es(set), [a,b] = examRange(part); for(let n=a;n<=b;n++) delete e.ans[n]; e.graded[part] = false; save(); render(); }
function renderExam(){
  let h = `<div class="row" style="margin-bottom:10px">${Object.keys(EXAMS).map(k => `<button class="btn ${k === curExam ? '' : 'sec'}" onclick="curExam='${k}';render()">${EXAMS[k].name}</button>`).join('')}</div>`;
  h += `<p class="note">試験本番は問1〜30（一般問題）と問31〜50（配線図）の計50問・120分。1問2点で60点以上が合格ライン。解答は電気技術者試験センターの公表値。</p>`;
  h += examHTML(curExam,1) + examHTML(curExam,2);
  $('#v-exam').innerHTML = h;
}

// ====== 弱点復習 ======
function wrongList(){
  const out = [];
  DAYS.filter(d => d.quiz).forEach(d => { const st = ds(d.id); d.quiz.forEach((q,i) => { if(st.quiz[i] !== undefined && st.quiz[i] !== q.a) out.push({d,q,i}); }); });
  return out;
}
function reviewHTML(){
  const w = wrongList();
  let h = `<h2>間違えた練習問題（${w.length}問）</h2><div class="card">`;
  if(!w.length) h += `<p style="margin:0">間違えた問題はありません。</p>`;
  else h += w.map(x => `<div class="q"><div class="note">Day ${x.d.id} ${esc(x.d.title)}</div><div class="qt">${esc(x.q.q)}</div><div class="exp">正解：${L[x.q.a]}．${esc(x.q.c[x.q.a])} ／ ${esc(x.q.e)}</div><div class="row" style="margin-top:6px"><button class="btn sec" onclick="retry(${x.d.id},${x.i})">解き直す</button></div></div>`).join('');
  h += `</div>`;
  const miss = [];
  Object.keys(EXAMS).forEach(k => { const e = es(k), key = EXAMS[k].key; [1,2].forEach(p => { if(!e.graded[p]) return; const [a,b] = examRange(p); for(let n=a;n<=b;n++) if(e.ans[n] !== key[n-1]) miss.push(EXAMS[k].name.split('（')[0]+' 問'+n); }); });
  h += `<h2>過去問で間違えた問題（${miss.length}問）</h2><div class="card">${miss.length ? miss.map(esc).join('、') : '<p style="margin:0">採点済みの過去問で間違えた問題はありません。</p>'}</div>`;
  return h;
}
function retry(id,i){ delete ds(id).quiz[i]; save(); openDay(id); }
function renderWeak(){ $('#v-weak').innerHTML = `<p class="note">「解き直す」を押すと、その日のページが開いて問題が未回答に戻る。</p>` + reviewHTML(); }

// ====== 時間割 ======
function renderTT(){
  let h = `<div class="card"><h3>毎日の時間割（1日60分）</h3>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
    <div><b>学習日（Day 1〜21）</b><ul class="tt-list">${TIMETABLE.study.map(r => `<li><b>${r[0]}</b><span>${esc(r[1])}</span></li>`).join('')}</ul></div>
    <div><b>過去問の日（前半：問1〜30）</b><ul class="tt-list">${TIMETABLE.exam1.map(r => `<li><b>${r[0]}</b><span>${esc(r[1])}</span></li>`).join('')}</ul></div>
    <div><b>過去問の日（後半：問31〜50）</b><ul class="tt-list">${TIMETABLE.exam2.map(r => `<li><b>${r[0]}</b><span>${esc(r[1])}</span></li>`).join('')}</ul></div>
    <div><b>総復習の日（Day 28）</b><ul class="tt-list">${TIMETABLE.review.map(r => `<li><b>${r[0]}</b><span>${esc(r[1])}</span></li>`).join('')}</ul></div>
    </div></div>`;
  h += `<h2>28日間のカリキュラム</h2><div class="card tscroll"><table><thead><tr><th>Day</th><th>日付</th><th>分野</th><th>内容</th><th>本のページ</th><th>状態</th></tr></thead><tbody>`;
  DAYS.forEach(d => { const st = ds(d.id);
    h += `<tr style="cursor:pointer" onclick="openDay(${d.id})"><td class="num">${d.id}</td><td style="white-space:nowrap">${md(d.date)}（${wd(d.date)}）</td><td style="white-space:nowrap">${esc(d.cat)}</td><td>${esc(d.title)}</td><td style="white-space:nowrap">${d.book || '–'}</td><td>${st.done ? '<span style="color:var(--ok)">完了</span>' : ''}</td></tr>`; });
  h += `</tbody></table></div>`;
  $('#v-tt').innerHTML = h;
}

// ====== データ ======
function renderData(){
  $('#v-data').innerHTML = `<div class="card"><h3>進捗データ</h3>
    <p class="note">進捗はこのブラウザの中だけに保存される。別のブラウザやMacに移すときは書き出して読み込む。</p>
    <div class="row"><button class="btn" onclick="exportData()">書き出す（JSON）</button>
    <label class="btn sec" style="cursor:pointer">読み込む<input type="file" accept=".json" style="display:none" onchange="importData(this.files[0])"></label>
    <button class="btn sec" style="color:var(--ng)" onclick="if(confirm('すべての進捗を消します。よろしいですか？')){S={days:{},exams:{},cards:{}};FCS.day=FCS.drill=null;save();render();}">すべて消す</button></div></div>`;
}
function exportData(){ const b = new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'denko2-progress-'+todayStr()+'.json'; a.click(); }
function importData(f){ if(!f) return; const r = new FileReader(); r.onload = () => { try{ const s = JSON.parse(r.result); if(s.days){ if(!s.cards) s.cards = {}; S = s; FCS.day = FCS.drill = null; save(); alert('読み込みました'); render(); } }catch(e){ alert('読み込めませんでした'); } }; r.readAsText(f); }

// ====== テーマ ======
(function(){ let t = null; try{ t = localStorage.getItem(KEY+'-theme'); }catch(e){} if(t) document.documentElement.dataset.theme = t; })();
$('#themeBtn').onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx; try{ localStorage.setItem(KEY+'-theme', nx); }catch(e){} };

function render(){ ({home:renderHome,drill:renderDrill,day:renderDay,exam:renderExam,weak:renderWeak,tt:renderTT,data:renderData})[view](); }
render();
</script>
