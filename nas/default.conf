# private-web（nginx）の設定。静的ファイルの配信に加えて /api/ を同期サーバーへ渡す
server {
    listen       8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }
    # HTMLとJSは毎回最新を確認する（画像はブラウザのキャッシュを使う）
    location ~* \.(html|js)$ {
        add_header Cache-Control "no-cache";
    }
    location /api/ {
        proxy_pass http://sync:8000;
        proxy_set_header Host $host;
        client_max_body_size 5m;
    }
}
